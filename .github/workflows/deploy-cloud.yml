name: Deploy cloud backend (manual)
on:
  workflow_dispatch:
    inputs:
      update_password:
        description: Explicitly update GAME_ACCESS_PASSWORD from the existing secret
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  deploy-backend:
    uses: ./.github/workflows/deploy-backend.yml
    with:
      commit: ${{ github.sha }}
      game: true
      update_password: ${{ inputs.update_password }}
    secrets: inherit
