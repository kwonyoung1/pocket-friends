name: Deploy cloud backend (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    environment: cloud-backend
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # A fixed release avoids the unauthenticated latest-release API lookup.
          version: 2.121.0
      - name: Deploy authenticated game function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          GAME_ACCESS_PASSWORD: ${{ secrets.GAME_ACCESS_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Configure SUPABASE_ACCESS_TOKEN first.'; exit 1; }
          test -n "$PROJECT_REF" || { echo 'Configure SUPABASE_PROJECT_REF first.'; exit 1; }
          if test -n "$GAME_ACCESS_PASSWORD"; then
            umask 077
            password_file="$(mktemp)"
            trap 'rm -f "$password_file"' EXIT
            printf 'GAME_ACCESS_PASSWORD=%s\n' "$GAME_ACCESS_PASSWORD" > "$password_file"
            supabase secrets set --env-file "$password_file" --project-ref "$PROJECT_REF"
          fi
          supabase functions deploy game --project-ref "$PROJECT_REF"
