name: Deploy Treasure rewards (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy-treasure:
    runs-on: ubuntu-latest
    environment: cloud-backend
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Deploy isolated verified treasure rewards
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Configure SUPABASE_ACCESS_TOKEN first.'; exit 1; }
          test -n "$PROJECT_REF" || { echo 'Configure SUPABASE_PROJECT_REF first.'; exit 1; }
          supabase functions deploy treasure --project-ref "$PROJECT_REF"
