name: Deploy game update (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  deploy-treasure:
    uses: ./.github/workflows/deploy-backend.yml
    with:
      commit: ${{ github.sha }}
      game: true
      treasure: true
    secrets: inherit
