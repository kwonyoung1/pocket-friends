name: Merge verified trusted Codex changes
on:
  workflow_run:
    workflows: ['Test and deploy Pocket Friends', 'Verify isolated effects lab']
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  merge:
    runs-on: ubuntu-latest
    concurrency:
      group: codex-merge
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/github-script@v7
        env:
          AUTO_MERGE_ENABLED: ${{ vars.AUTO_MERGE_ENABLED }}
          AUTO_SERVER_DEPLOY_ENABLED: ${{ vars.AUTO_SERVER_DEPLOY_ENABLED }}
          TRUSTED_CODEX_ACTORS: ${{ vars.TRUSTED_CODEX_ACTORS }}
        with:
          script: |
            const {autoMerge} = await import(`${process.env.GITHUB_WORKSPACE}/scripts/automation/github.mjs`)
            const run=context.payload.workflow_run
            if(run.conclusion!=='success'){
              await core.summary.addHeading('Validation / release stopped').addLink('Failed run',run.html_url).addRaw(' No deployment or data reset is used to hide a failure.').write()
              if(run.head_repository?.full_name===`${context.repo.owner}/${context.repo.repo}`&&run.conclusion==='startup_failure'&&run.run_attempt===1){
                await github.rest.actions.reRunWorkflowFailedJobs({...context.repo,run_id:run.id})
                return
              }
            }
            await autoMerge({github,context,core})
